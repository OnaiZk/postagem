<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/eletromidia-app logo-512px.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FF4F00" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eletromidia Postagem" />
    <meta name="description" content="Dashboard e Checklist de Postagem Eletromidia" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/eletromidia-app logo-512px.png" />
    <title>Eletromidia | Controle de Postagem & Protocolos</title>
    <!-- Google Fonts fallbacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Rethink Sans';
        src: url('/fonts/RethinkSans-Medium.ttf') format('truetype');
        font-weight: 400 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Rethink Sans';
        src: url('/fonts/RethinkSans-Bold.ttf') format('truetype');
        font-weight: 600 700 800;
        font-style: normal;
        font-display: swap;
      }
      body {
        font-family: 'Rethink Sans', system-ui, -apple-system, sans-serif;
        background-color: #F8F9FA;
        color: #121214;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body class="bg-[#F4F4F6] text-zinc-900 min-h-screen antialiased selection:bg-[#FF4F00] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration error', err));
        });
      }
    </script>
  </body>
</html>
